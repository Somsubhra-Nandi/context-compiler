[project]
name = "context-compiler"
version = "0.0.0"
description = "Context Compiler — Hack Hydra Track 2B"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.20",
    "tiktoken>=0.13",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
vector = [
    "numpy==2.2.3",
    "sentence-transformers==3.4.1",
    "transformers==4.49.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
